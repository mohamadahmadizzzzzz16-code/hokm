<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <style>
    body { background: #1a5e20; display: flex; flex-direction: column; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
    
    /* ظرف کارت‌ها */
    .hand { display: flex; position: absolute; bottom: 50px; justify-content: center; }
    
    /* ظاهر کارت */
    .card {
      width: 60px; height: 90px; background: white; border-radius: 8px;
      margin: 0 -15px; /* باعث می‌شود کارت‌ها روی هم بیفتند */
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      font-size: 20px; font-weight: bold;
    }
    
    /* افکت بادبزنی */
    .card:nth-child(1) { transform: rotate(-15deg); }
    .card:nth-child(2) { transform: rotate(-5deg); }
    .card:nth-child(4) { transform: rotate(5deg); }
    .card:nth-child(5) { transform: rotate(15deg); }
    
    .red { color: red; }
    .black { color: black; }
  </style>
</head>
<body>

<div class="hand">
  <div class="card red">A ♥</div>
  <div class="card black">K ♠</div>
  <div class="card black">Q ♣</div>
  <div class="card red">J ♦</div>
  <div class="card black">10 ♣</div>
</div>

</body>
</html>
